<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor History</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --primary: #1a56db;
            --primary-dark: #164ec9;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* ===== TOP NAVBAR ===== */
        .topbar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            height: 64px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1040;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            box-shadow: var(--shadow-lg);
        }

        .topbar .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .topbar .brand i {
            font-size: 1.5rem;
        }

        .topbar .nav-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .topbar .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            transition: all 0.2s;
            text-decoration: none;
        }

        .topbar .btn-icon:hover {
            background: rgba(255,255,255,0.25);
        }

        .topbar .btn-back {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 1rem;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .topbar .btn-back:hover {
            background: rgba(255,255,255,0.25);
            color: #fff;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 64px;
            left: 0;
            bottom: 0;
            z-index: 1030;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(-260px);
        }

        .sidebar-nav {
            list-style: none;
            padding: 1rem 0.75rem;
            flex: 1;
        }

        .sidebar-nav li {
            margin-bottom: 0.25rem;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .sidebar-nav a i {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background: #eff6ff;
            color: var(--primary);
        }

        .sidebar-nav a.active {
            box-shadow: 0 0 0 1px rgba(26,86,219,0.1);
        }

        .sidebar-footer {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .sidebar-footer .btn-logout {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            font-weight: 500;
            transition: all 0.2s;
        }

        .sidebar-footer .btn-logout:hover {
            background: #fef2f2;
            color: var(--danger);
            border-color: #fecaca;
        }

        /* ===== MAIN CONTENT ===== */
        .main-wrapper {
            margin-left: 260px;
            margin-top: 64px;
            padding: 1.5rem;
            min-height: calc(100vh - 64px);
            transition: margin-left 0.3s ease;
        }

        .main-wrapper.expanded {
            margin-left: 0;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h2 {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .page-header h2 i {
            color: var(--primary);
        }

        /* ===== CARD ===== */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: var(--shadow);
            transition: box-shadow 0.2s;
            overflow: hidden;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.25rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .card-header .header-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-body {
            padding: 1.25rem;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 220px;
            max-width: 400px;
        }

        .search-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-wrapper input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.9rem;
            color: var(--text-main);
            background: #fff;
            transition: all 0.2s;
            outline: none;
        }

        .search-wrapper input::placeholder {
            color: #94a3b8;
        }

        .search-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(26, 86, 219, 0.1);
        }

        .btn-report {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.25rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            white-space: nowrap;
        }

        .btn-report:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.4);
        }

        .btn-report:active {
            transform: translateY(0);
        }

        /* ===== TABLE ===== */
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .data-table thead th {
            background: #f8fafc;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.85rem 1rem;
            border-bottom: 1.5px solid var(--border-color);
            white-space: nowrap;
        }

        .data-table thead th:first-child {
            border-top-left-radius: 10px;
        }

        .data-table thead th:last-child {
            border-top-right-radius: 10px;
        }

        .data-table tbody tr {
            transition: background 0.15s;
        }

        .data-table tbody tr:hover {
            background: #f8fafc;
        }

        .data-table tbody td {
            padding: 0.9rem 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.88rem;
            color: var(--text-main);
            vertical-align: middle;
        }

        .data-table tbody tr:last-child td:first-child {
            border-bottom-left-radius: 10px;
        }

        .data-table tbody tr:last-child td:last-child {
            border-bottom-right-radius: 10px;
        }

        .data-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Status badges inside table */
        .tb-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tb-badge.safe {
            background: #ecfdf5;
            color: var(--success);
        }

        .tb-badge.warn {
            background: #fff7ed;
            color: var(--warning);
        }

        .tb-badge.danger {
            background: #fef2f2;
            color: var(--danger);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .empty-state i {
            font-size: 3rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        .empty-state h5 {
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 991.98px) {
            .sidebar {
                transform: translateX(-260px);
            }
            .sidebar.open {
                transform: translateX(0);
                box-shadow: 4px 0 24px rgba(0,0,0,0.15);
            }
            .main-wrapper {
                margin-left: 0;
            }
        }

        @media (max-width: 767.98px) {
            .topbar {
                padding: 0 1rem;
            }
            .main-wrapper {
                padding: 1rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .search-wrapper {
                max-width: 100%;
            }
            .btn-report {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

<!-- TOP NAVBAR -->
<nav class="topbar">
    <button class="btn btn-icon me-3" onclick="toggleSidebar()" title="Toggle Menu">
        <i class="bi bi-list"></i>
    </button>

    <a href="#" class="brand">
        <i class="bi bi-shield-check"></i>
        Smart Safety Vest
    </a>

    <div class="nav-actions">
        <a href="../dashboard.html" class="btn-back">
            <i class="bi bi-arrow-left"></i>
            Dashboard
        </a>
    </div>
</nav>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
    <ul class="sidebar-nav">
        <li>
            <a href="../dashboard.html">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>
        </li>
        <li>
            <a href="history.html" class="active">
                <i class="bi bi-clock-history"></i>
                History
            </a>
        </li>
        <li>
            <a href="alerts.html">
                <i class="bi bi-exclamation-triangle"></i>
                Alerts
            </a>
        </li>
        <li>
            <a href="users.html">
                <i class="bi bi-people"></i>
                Users
            </a>
        </li>
    </ul>
    <div class="sidebar-footer">
        <button class="btn-logout" onclick="logout()">
            <i class="bi bi-box-arrow-left"></i>
            Logout
        </button>
    </div>
</aside>

<!-- MAIN CONTENT -->
<main class="main-wrapper" id="mainContent">

    <!-- Page Header -->
    <div class="page-header">
        <h2><i class="bi bi-clock-history"></i> Sensor History</h2>
    </div>

    <!-- History Card -->
    <div class="card">
        <div class="card-header">
            <div class="header-title">
                <i class="bi bi-table text-primary"></i>
                Historical Sensor Data
            </div>
        </div>
        <div class="card-body">

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="search-wrapper">
                    <i class="bi bi-search"></i>
                    <input id="search" type="text" placeholder="Search history..." onkeyup="searchHistory()">
                </div>
                <button class="btn-report" onclick="generateReport()">
                    <i class="bi bi-file-earmark-pdf"></i>
                    Generate Safety Report
                </button>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Temperature</th>
                            <th>Humidity</th>
                            <th>Gas</th>
                            <th>Heart Rate</th>
                            <th>Fall</th>
                            <th>Location</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable">
                        <!-- Data populated by history.js -->
                        <tr>
                            <td colspan="7">
                                <div class="empty-state">
                                    <i class="bi bi-clock"></i>
                                    <h5>No History Yet</h5>
                                    <p>Sensor readings will appear here once data is received.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="../js/firebase.js"></script>

<!-- PDF Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="../js/logo.js"></script>

<!-- Auth -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="../js/auth.js"></script>
<script>checkAuth(true);</script>

<!-- App Scripts -->
<script src="../js/history.js"></script>
<script src="../js/reports.js"></script>

<script>
    // Sidebar Toggle
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');

        if (window.innerWidth < 992) {
            sidebar.classList.toggle('open');
        } else {
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');
        }
    }

    // Close sidebar on outside click (mobile)
    document.addEventListener('click', function(e) {
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.querySelector('[onclick="toggleSidebar()"]');
        if (window.innerWidth < 992 && sidebar.classList.contains('open')) {
            if (!sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        }
    });
</script>

</body>
</html>
