<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Vest Alerts</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --primary: #1a56db;
            --primary-dark: #164ec9;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* ===== TOP NAVBAR ===== */
        .topbar {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            height: 64px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1040;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            box-shadow: var(--shadow-lg);
        }

        .topbar .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .topbar .brand i {
            font-size: 1.5rem;
        }

        .topbar .nav-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .topbar .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            transition: all 0.2s;
            text-decoration: none;
        }

        .topbar .btn-icon:hover {
            background: rgba(255,255,255,0.25);
        }

        .topbar .btn-back {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 1rem;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .topbar .btn-back:hover {
            background: rgba(255,255,255,0.25);
            color: #fff;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 64px;
            left: 0;
            bottom: 0;
            z-index: 1030;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(-260px);
        }

        .sidebar-nav {
            list-style: none;
            padding: 1rem 0.75rem;
            flex: 1;
        }

        .sidebar-nav li {
            margin-bottom: 0.25rem;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .sidebar-nav a i {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background: #fef2f2;
            color: var(--danger);
        }

        .sidebar-nav a.active {
            box-shadow: 0 0 0 1px rgba(220,38,38,0.1);
        }

        .sidebar-footer {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .sidebar-footer .btn-logout {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            font-weight: 500;
            transition: all 0.2s;
        }

        .sidebar-footer .btn-logout:hover {
            background: #fef2f2;
            color: var(--danger);
            border-color: #fecaca;
        }

        /* ===== MAIN CONTENT ===== */
        .main-wrapper {
            margin-left: 260px;
            margin-top: 64px;
            padding: 1.5rem;
            min-height: calc(100vh - 64px);
            transition: margin-left 0.3s ease;
        }

        .main-wrapper.expanded {
            margin-left: 0;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h2 {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .page-header h2 i {
            color: var(--danger);
        }

        .alert-stats {
            display: flex;
            gap: 0.75rem;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background: #fff;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .stat-pill.danger { color: var(--danger); }
        .stat-pill.warning { color: var(--warning); }
        .stat-pill.info { color: var(--info); }

        /* ===== CARDS ===== */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: var(--shadow);
            transition: box-shadow 0.2s;
            overflow: hidden;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.25rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-body {
            padding: 1.25rem;
        }

        /* ===== ALERT ITEMS ===== */
        .alert-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .alert-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #fff;
            transition: all 0.2s;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-item:hover {
            border-color: #cbd5e1;
            box-shadow: var(--shadow);
        }

        .alert-item.critical {
            border-left: 4px solid var(--danger);
            background: linear-gradient(90deg, #fef2f2 0%, #fff 100%);
        }

        .alert-item.warning {
            border-left: 4px solid var(--warning);
            background: linear-gradient(90deg, #fff7ed 0%, #fff 100%);
        }

        .alert-item.info {
            border-left: 4px solid var(--info);
            background: linear-gradient(90deg, #eff6ff 0%, #fff 100%);
        }

        .alert-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .alert-icon.danger { background: #fef2f2; color: var(--danger); }
        .alert-icon.warning { background: #fff7ed; color: var(--warning); }
        .alert-icon.info { background: #eff6ff; color: var(--info); }

        .alert-content {
            flex: 1;
            min-width: 0;
        }

        .alert-content h6 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .alert-content p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.5;
        }

        .alert-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .alert-badge {
            padding: 0.2rem 0.55rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .alert-badge.critical { background: #fef2f2; color: var(--danger); }
        .alert-badge.warning { background: #fff7ed; color: var(--warning); }
        .alert-badge.info { background: #eff6ff; color: var(--info); }

        .alert-time {
            white-space: nowrap;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .empty-state i {
            font-size: 3rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        .empty-state h5 {
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 991.98px) {
            .sidebar {
                transform: translateX(-260px);
            }
            .sidebar.open {
                transform: translateX(0);
                box-shadow: 4px 0 24px rgba(0,0,0,0.15);
            }
            .main-wrapper {
                margin-left: 0;
            }
        }

        @media (max-width: 767.98px) {
            .topbar {
                padding: 0 1rem;
            }
            .main-wrapper {
                padding: 1rem;
            }
            .alert-item {
                flex-direction: column;
                gap: 0.75rem;
            }
            .alert-time {
                align-self: flex-start;
            }
        }
    </style>
</head>

<body>

<!-- TOP NAVBAR -->
<nav class="topbar">
    <button class="btn btn-icon me-3" onclick="toggleSidebar()" title="Toggle Menu">
        <i class="bi bi-list"></i>
    </button>

    <a href="#" class="brand">
        <i class="bi bi-shield-check"></i>
        Smart Safety Vest
    </a>

    <div class="nav-actions">
        <a href="../dashboard.html" class="btn-back">
            <i class="bi bi-arrow-left"></i>
            Dashboard
        </a>
    </div>
</nav>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
    <ul class="sidebar-nav">
        <li>
            <a href="../dashboard.html">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>
        </li>
        <li>
            <a href="history.html">
                <i class="bi bi-clock-history"></i>
                History
            </a>
        </li>
        <li>
            <a href="alerts.html" class="active">
                <i class="bi bi-exclamation-triangle"></i>
                Alerts
            </a>
        </li>
        <li>
            <a href="users.html">
                <i class="bi bi-people"></i>
                Users
            </a>
        </li>
    </ul>
    <div class="sidebar-footer">
        <button class="btn-logout" onclick="logout()">
            <i class="bi bi-box-arrow-left"></i>
            Logout
        </button>
    </div>
</aside>

<!-- MAIN CONTENT -->
<main class="main-wrapper" id="mainContent">

    <!-- Page Header -->
    <div class="page-header">
        <h2><i class="bi bi-exclamation-triangle-fill"></i> Alert History</h2>
        <div class="alert-stats">
            <div class="stat-pill danger">
                <i class="bi bi-circle-fill" style="font-size:0.5rem;"></i>
                <span id="criticalCount">0 Critical</span>
            </div>
            <div class="stat-pill warning">
                <i class="bi bi-circle-fill" style="font-size:0.5rem;"></i>
                <span id="warningCount">0 Warnings</span>
            </div>
        </div>
    </div>

    <!-- Alert Container -->
    <div class="card">
        <div class="card-header">
            <i class="bi bi-bell-fill text-danger"></i>
            Recent Alerts
        </div>
        <div class="card-body">
            <div id="alertContainer" class="alert-list">
                <!-- Dynamic alert items will be injected here by alerts.js -->
                <div class="empty-state">
                    <i class="bi bi-bell-slash"></i>
                    <h5>No Alerts Yet</h5>
                    <p>Alerts will appear here when triggered by the safety vest sensors.</p>
                </div>
            </div>
        </div>
    </div>

</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="../js/firebase.js"></script>
<script src="../js/auth.js"></script>
<script>checkAuth(true);</script>
<script src="../js/alerts.js"></script>

<script>
    // Sidebar Toggle
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');

        if (window.innerWidth < 992) {
            sidebar.classList.toggle('open');
        } else {
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');
        }
    }

    // Close sidebar on outside click (mobile)
    document.addEventListener('click', function(e) {
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.querySelector('[onclick="toggleSidebar()"]');
        if (window.innerWidth < 992 && sidebar.classList.contains('open')) {
            if (!sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        }
    });
</script>

</body>
</html>
